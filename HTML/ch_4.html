<!DOCTYPE html>
<html lang="en">

<head>
    <title> Chapter 4 - Forms</title>
</head>

<body>
    <h1>Basic Details Form</h1>
    <form action="post">
        <div>
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" placeholder="Enter your username">
        </div><br>
        <div>
            <label for="password">Password:</label>
            <input type="password" name="password" placeholder="Enter your password">
        </div><br>
        <div>
            <label>Gender:</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
        </div><br>
        <div>
            <input type="checkbox" id="subscribe" name="subscribe" value="yes">
            <label for="subscribe">Subscribe to email</label>
        </div><br>
        <div>
            <label for="msg">Feedback:</label><br>
            <textarea id="msg" name="message" placeholder="Enter your feedback here"></textarea><br><br>
            <label>Education:</label>
            <select name="edu" placeholder="Select from dd">
                <option value="" disabled selected hidden>Select</option>
                <option value="10th">Till 10th</option>
                <option value="12th">Till 12th</option>
                <option value="12th+">12th+</option>
            </select>
            <input type="submit" value="Submit">
        </div><br>

</html>
